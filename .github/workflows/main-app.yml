name: main-application-workflow

on:
  push:
    branches:
      - main
    paths:
      - './src/**'
      - './pom.xml'
      - '.github/workflows/main-app.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: code_review_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d code_review_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/code_review_db
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: >
          echo "Checking database configuration..."
          test -n "$DB_URL" || exit 1
          test -n "$DB_USERNAME" || exit 1
          test -n "$DB_PASSWORD" || exit 1
          
          mvn --batch-mode clean package 
          -Ddb.url="$DB_URL"
          -Ddb.user="$DB_USERNAME"
          -Ddb.password="$DB_PASSWORD"


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/code-review:latest
            ${{ secrets.DOCKER_USERNAME }}/code-review:${{ github.sha }}
